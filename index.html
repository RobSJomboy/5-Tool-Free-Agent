<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5-Tool Free Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    background: #f6f1e5; color: #13294b; font: 500 19px/1.4 'Barlow Condensed', sans-serif; }
  main { max-width: 640px; text-align: center; }
  .k { font: 700 16px 'Barlow Condensed', sans-serif; letter-spacing: .12em; color: #a8790a; }
  h1 { font: 700 72px/1 'Oswald', sans-serif; text-transform: uppercase; margin: 6px 0 14px; background: #173a5e; color: #f6f1e5; padding: 12px 20px 10px; border-bottom: 6px solid #e9b949; }
  h1 b { color: #e9b949; }
  .tools { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 18px 0 22px; }
  .tools span { font: 700 24px/1 'Oswald', sans-serif; padding: 6px 14px 5px; color: #fff; }
  a.btn { display: inline-block; margin: 6px; padding: 12px 24px 10px; background: #13294b; color: #f6f1e5; font: 600 22px 'Oswald', sans-serif; text-transform: uppercase; text-decoration: none; border-bottom: 4px solid #e9b949; }
  p { color: #5d6e82; }
</style>
</head>
<body>
<main>
  <div class="k">TALKIN' BASEBALL</div>
  <h1><b>5-Tool</b> Free Agent</h1>
  <div class="tools">
    <span style="background:#c98a00">HIT</span><span style="background:#c8102e">POWER</span><span style="background:#1d7f45">SPEED</span><span style="background:#1f5fbf">ARM</span><span style="background:#6b3fa0">GLOVE</span>
  </div>
  <p>Drag this winter's free agents into a five-circle Venn of the five tools, then let Baseball Savant check the hosts' work.</p>
  <a class="btn" href="control.html">Open control</a>
  <p style="font-size:14px">The control page gives you the OBS URL for the display (1920×1080 Browser Source).</p>
</main>
</body>
</html>
