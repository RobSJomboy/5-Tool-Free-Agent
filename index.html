<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5-Tool Free Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    background: radial-gradient(900px 700px at 50% 40%, #183a55, #0a1824); color: #f4f1ea; font: 16px/1.5 'DM Sans', sans-serif; }
  main { max-width: 640px; text-align: center; }
  .k { font: 14px 'DM Mono', monospace; letter-spacing: .18em; color: #fbcc7a; }
  h1 { font: 72px/1 'Bebas Neue', sans-serif; font-weight: 400; margin: 8px 0 12px; }
  h1 b { color: #fbcc7a; font-weight: 400; }
  .tools { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 18px 0 26px; }
  .tools span { font: 22px/1 'Bebas Neue', sans-serif; letter-spacing: .06em; padding: 7px 14px 4px; border-radius: 30px; border: 2px solid; }
  a.btn { display: inline-block; margin: 6px; padding: 12px 22px; border-radius: 10px; background: #fbcc7a; color: #10202c; font-weight: 700; text-decoration: none; }
  a.btn.alt { background: #1b3a52; color: #f4f1ea; border: 1px solid rgba(255,255,255,.2); }
  p { color: #b9c7d3; }
</style>
</head>
<body>
<main>
  <div class="k">TALKIN' BASEBALL</div>
  <h1>THE <b>5-TOOL</b> FREE AGENT</h1>
  <div class="tools">
    <span style="color:#f5c451">HIT</span><span style="color:#ff6b4a">POWER</span><span style="color:#3ddc97">SPEED</span><span style="color:#4aa8ff">ARM</span><span style="color:#c084fc">GLOVE</span>
  </div>
  <p>Drag this winter's free agents into a five-circle Venn of the five tools, then let Baseball Savant check the hosts' work.</p>
  <a class="btn" href="control.html">Open control</a>
  <p style="font-size:14px">The control page gives you the OBS URL for the display (1920×1080 Browser Source).</p>
</main>
</body>
</html>
